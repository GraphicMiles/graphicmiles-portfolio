name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The build has no runtime or dev dependencies; it is a plain Node script.
      - name: Build the site
        run: node static-build.js

      - name: Check the build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html

          # Guard: development files must never be deployed. These used to be
          # copied into dist/ and served publicly over HTTP 200.
          leaked=0
          for p in tests scripts playwright.config.js README.md package.json static-build.js vercel.json; do
            if [ -e "dist/$p" ]; then
              echo "::error::dev file leaked into dist: $p"
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ]

          echo "dist built:"
          du -sh dist
